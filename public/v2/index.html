<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>criyz · 树鱼</title>
    <meta name="description" content="criyz 的昼夜场景式个人网站入口。" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" as="image" href="/room-day.jpg" />
    <link rel="preload" as="image" href="/room-night.jpg" />
    <link rel="stylesheet" href="/v2/assets/index-CczfS6YC.css" />
  </head>
  <body>
    <main class="room-page room-page--day room-page--ready">
      <div class="room-scene-frame">
        <img class="room-scene-image room-scene-image--day" src="/room-day.jpg" alt="日间的阁楼画室" width="2048" height="1152" />
        <img class="room-scene-image room-scene-image--night" src="/room-night.jpg" alt="夜间的阁楼画室" width="2048" height="1152" />
        <button class="room-light-switch" type="button" aria-label="切换到夜间场景" aria-pressed="false" title="当前为日间场景，点击切换">
          <span class="room-bulb" aria-hidden="true"></span>
          <span class="room-mode-label" aria-hidden="true">DAY</span>
        </button>
        <nav aria-label="场景导航">
          <a class="room-hotspot room-hotspot--analysis" href="/v2/game-analysis"><span class="room-hotspot-label"><span class="room-hotspot-marker" aria-hidden="true">▶</span><span>游戏分析</span></span></a>
          <a class="room-hotspot room-hotspot--experience" href="/v2/game-experience"><span class="room-hotspot-label"><span class="room-hotspot-marker" aria-hidden="true">▶</span><span>游戏经历</span></span></a>
          <a class="room-hotspot room-hotspot--avg" href="/v2/avg-game"><span class="room-hotspot-label"><span class="room-hotspot-marker" aria-hidden="true">▶</span><span>文字互动游戏（已上线）</span></span></a>
        </nav>
        <p class="room-time-note">criyz.树鱼</p>
      </div>
    </main>
    <script>
      (() => {
        const page = document.querySelector('.room-page');
        const button = document.querySelector('.room-light-switch');
        const label = button.querySelector('.room-mode-label');
        let manual = false;

        function setMode(night) {
          page.classList.toggle('room-page--night', night);
          page.classList.toggle('room-page--day', !night);
          button.setAttribute('aria-pressed', String(night));
          button.setAttribute('aria-label', night ? '切换到日间场景' : '切换到夜间场景');
          button.title = night ? '当前为夜间场景，点击切换' : '当前为日间场景，点击切换';
          label.textContent = night ? 'NIGHT' : 'DAY';
        }

        function updateFromClock() {
          if (manual) return;
          const hour = new Date().getHours();
          setMode(hour < 6 || hour >= 18);
        }

        updateFromClock();
        window.setInterval(updateFromClock, 60_000);
        button.addEventListener('click', () => {
          manual = true;
          setMode(!page.classList.contains('room-page--night'));
        });
      })();
    </script>
  </body>
</html>
